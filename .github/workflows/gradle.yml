# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: :pets-core:iosSimulatorArm64Test
            os: macos-latest
          - target: :pets-core:jvmTest
            os: ubuntu-latest
          - target: :pets-core:jvmTest
            os: windows-latest
          - target: :pets-core:assemble
            os: ubuntu-latest
          - target: :pets-core:checkKotlinAbi
            os: ubuntu-latest
          - target: :pets-io:iosSimulatorArm64Test
            os: macos-latest
          - target: :pets-io:jvmTest
            os: ubuntu-latest
          - target: :pets-io:jvmTest
            os: windows-latest
          - target: :pets-io:assemble
            os: ubuntu-latest
          - target: :pets-io:checkKotlinAbi
            os: ubuntu-latest
          - target: :pets-compose:iosSimulatorArm64Test
            os: macos-latest
          - target: :pets-compose:jvmTest
            os: ubuntu-latest
          - target: :pets-compose:jvmTest
            os: windows-latest
          - target: :pets-apple:verifySwiftConsumer
            os: macos-latest
          - target: :pets-compose:assemble
            os: ubuntu-latest
          - target: :pets-compose:checkKotlinAbi
            os: ubuntu-latest
          - target: :pets-host:iosSimulatorArm64Test
            os: macos-latest
          - target: :pets-host:jvmTest
            os: ubuntu-latest
          - target: :pets-host:jvmTest
            os: windows-latest
          - target: :pets-host:assemble
            os: ubuntu-latest
          - target: :pets-host:checkKotlinAbi
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v4
    - uses: actions/cache@v4
      with:
        path: |
          ~/.konan
        key: ${{ runner.os }}-${{ hashFiles('**/.lock') }}
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build with Gradle
      uses: gradle/gradle-build-action@ce999babab2de1c4b649dc15f0ee67e6246c994f
      with:
        arguments: ${{ matrix.target }}

  android-api24:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Run Compose and real host overlay device tests on API 24
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 24
        target: default
        arch: x86_64
        disable-animations: true
        script: |
          ./gradlew :pets-host:installAndroidDeviceTest --max-workers=1 -Dorg.gradle.jvmargs=-Xmx6g
          adb shell appops set com.yet.pets.host.test SYSTEM_ALERT_WINDOW allow
          ./gradlew :pets-compose:androidConnectedCheck :pets-host:androidConnectedCheck --max-workers=1 -Dorg.gradle.jvmargs=-Xmx6g

  android-api36:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Run Compose and real host overlay device tests on API 36
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 36
        target: default
        arch: x86_64
        disable-animations: true
        script: |
          ./gradlew :pets-host:installAndroidDeviceTest --max-workers=1 -Dorg.gradle.jvmargs=-Xmx6g
          adb shell appops set com.yet.pets.host.test SYSTEM_ALERT_WINDOW allow
          ./gradlew :pets-compose:androidConnectedCheck :pets-host:androidConnectedCheck --max-workers=1 -Dorg.gradle.jvmargs=-Xmx6g
